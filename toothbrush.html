<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e88e5" />
  <title>Toothbrush Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      /* svh = the *small* viewport (Safari toolbars showing), so the layout
           never extends behind the bottom toolbar. Avoid height:100%, which
           resolves to the large viewport and hides content under the bar. */
      min-height: 100svh;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        system-ui, sans-serif;
      background: #1e88e5;
      color: #fff;
      display: flex;
      align-items: stretch;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background 0.4s ease;
    }

    /* Each side gets its own bold background colour */
    body.side-0 {
      background: #43a047;
    }

    /* Top Right   */
    body.side-1 {
      background: #1e88e5;
    }

    /* Top Left    */
    body.side-2 {
      background: #8e24aa;
    }

    /* Bottom Right*/
    body.side-3 {
      background: #f4511e;
    }

    /* Bottom Left */
    body.celebrate {
      background: #ffb300;
    }

    .app {
      width: 100%;
      max-width: 640px;
      height: 100svh;
      /* Keep clear of the home indicator / floating bottom toolbar, plus a
           bit of extra gap so the circle never touches the address bar. */
      padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + clamp(28px, 6vh, 64px));
      display: flex;
      flex-direction: column;
    }

    /* Top content area: emoji / headline / timer / teeth */
    .stage {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 3vh, 32px);
      /* No bottom padding: the button starts right below the quadrants.
           Minimal top padding — just clear the notch/status bar. */
      padding: max(clamp(6px, 1.5vh, 20px), env(safe-area-inset-top, 0px)) 20px 0;
    }

    /* Reserve constant space so empty vs "Nice!" / emoji states don't
         resize the stage and shift the dial below the quadrants. */
    .headline {
      font-size: clamp(28px, 8vw, 56px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
      min-height: clamp(30px, 8.4vw, 59px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .emoji {
      font-size: clamp(64px, 20vw, 140px);
      line-height: 1;
      height: clamp(84px, 24vw, 172px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Circular progress ring with the countdown number inside */
    .timer-ring {
      position: relative;
      width: clamp(220px, 62vw, 340px);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-ring.hidden {
      display: none;
    }

    .timer-ring svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.25);
      stroke-width: 14;
    }

    .ring-fill {
      fill: none;
      stroke: #fff;
      stroke-width: 14;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }

    /* Big countdown number */
    .timer {
      font-size: clamp(70px, 22vw, 170px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      letter-spacing: -0.03em;
      transform: translateY(-0.052em)
    }

    /* Mouth map: 4 quadrants */
    .mouth {
      width: clamp(180px, 60vw, 320px);
      aspect-ratio: 1 / 0.8;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      margin: 0 auto;
    }

    .quad {
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(24px, 9vw, 48px);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    /* Rounded outer corners to hint a mouth shape */
    .quad.tr {
      border-top-right-radius: 60px;
    }

    .quad.tl {
      border-top-left-radius: 60px;
    }

    .quad.br {
      border-bottom-right-radius: 60px;
    }

    .quad.bl {
      border-bottom-left-radius: 60px;
    }

    .quad.done {
      background: rgba(255, 255, 255, 0.9);
    }

    .quad.active {
      background: #fff;
      color: #1e88e5;
      transform: scale(1.08);
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1.06);
      }

      50% {
        transform: scale(1.14);
      }
    }

    /* Shared circular slot below the quadrants. The timer ring and the
         button are stacked in the same grid cell, so their circles land in
         exactly the same place at the same size. */
    .dial {
      /* Zero flex-basis so the dial's share of the column doesn't depend on
         whether the button/ring is currently displayed (keeps the fortune
         emoji from shifting when the button reappears). */
      flex: 1 1 0;
      width: 100%;
      min-height: 0;
      /* just fill the space below the quadrants */
      display: grid;
      place-items: center;
    }

    .dial>* {
      grid-area: 1 / 1;
      /* stack both children in one cell */
    }

    /* The button is a big invisible hit target filling the whole slot —
         tappable pixels are large... */
    .btn {
      appearance: none;
      border: none;
      background: none;
      cursor: pointer;
      align-self: stretch;
      justify-self: stretch;
      width: 100%;
      height: 100%;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn.hidden {
      display: none;
    }

    /* ...but the visible control is a perfect circle, the same size as the
         timer ring and centered in the same spot, label in the middle. */
    .btn-face {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(220px, 62vw, 340px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff;
      color: #1e88e5;
      font-family: inherit;
      font-weight: 800;
      font-size: clamp(28px, 8vw, 48px);
      line-height: 1.05;
      text-align: center;
      padding: 16px;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.22);
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    .btn:active .btn-face {
      transform: scale(0.94);
      filter: brightness(0.94);
    }

    /* Celebration */
    .celebrate-emoji {
      font-size: clamp(84px, 24vw, 168px);
      line-height: 1;
      animation: bounce 0.8s ease infinite;
    }

    /* Fortune reveal — shown after the celebration, in place of the
       quadrants / 🎉 / "You did it!". The label sits at the top (inside the
       stage); the emoji lives in its own slot that fills the gap between the
       label and the button, so it lands centred in between. */
    .emoji.hidden,
    .headline.hidden,
    .mouth.hidden,
    .fortune-label.hidden,
    .fortune-slot.hidden {
      display: none;
    }

    .fortune-label {
      font-size: clamp(28px, 8vw, 56px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }

    /* Grows to fill the space between the label and the dial, centring the
       animal within it. Zero flex-basis (matching .dial) so the split stays
       50/50 whether or not the button is present — otherwise the emoji would
       shift up when the button reappears. */
    .fortune-slot {
      flex: 1 1 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fortune-emoji {
      font-size: clamp(96px, 30vw, 220px);
      line-height: 1;
      opacity: 0; /* held hidden until it tweens in after a short delay */
    }

    /* Pop-in: fade up while shrinking from oversized down to actual size. */
    .fortune-emoji.reveal {
      animation: fortune-pop 0.55s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
    }

    @keyframes fortune-pop {
      from {
        opacity: 0;
        transform: scale(2.6);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0) rotate(-6deg);
      }

      50% {
        transform: translateY(-24px) rotate(6deg);
      }
    }

    .confetti {
      position: fixed;
      top: 0;
      font-size: 28px;
      animation: fall linear forwards;
      pointer-events: none;
      will-change: transform;
    }

    @keyframes fall {
      from {
        /* Start well above the very top edge (behind the notch) so pieces
             clearly rain down from the top of the screen. */
        transform: translateY(-20vh) rotate(0);
        opacity: 1;
      }

      to {
        transform: translateY(110vh) rotate(540deg);
        opacity: 0.2;
      }
    }
  </style>
</head>

<body class="side-0">
  <div class="app" id="app">
    <!-- Top: emoji / headline / teeth quadrants -->
    <div class="stage">
      <div class="emoji" id="emoji">🦷</div>
      <div class="headline" id="headline">Toothbrush Timer</div>

      <div class="mouth" id="mouth" aria-hidden="true">
        <div class="quad tl" data-quad="1">🙂</div>
        <div class="quad tr" data-quad="0">🙂</div>
        <div class="quad bl" data-quad="3">🙂</div>
        <div class="quad br" data-quad="2">🙂</div>
      </div>

      <!-- Fortune headline, shown at the end in place of the quadrants. -->
      <div class="fortune-label hidden" id="fortuneLabel" aria-hidden="true">
        Your fortune is:
      </div>
    </div>

    <!-- The fortune animal sits in its own flexible slot between the label
         above and the button below, so it appears centred in the gap. -->
    <div class="fortune-slot hidden" id="fortuneSlot" aria-hidden="true">
      <div class="fortune-emoji" id="fortuneEmoji"></div>
    </div>

    <!-- Shared circular slot below the quadrants: the timer ring and the
           button's circle occupy the same place and size (only one shows at
           a time). The whole area is the button hit target. -->
    <div class="dial">
      <div class="timer-ring hidden" id="timerRing">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="ring-track" cx="100" cy="100" r="90"></circle>
          <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="90"></circle>
        </svg>
        <div class="timer" id="timer">30</div>
      </div>

      <button class="btn" id="btn">
        <span class="btn-face" id="btnFace">Start</span>
      </button>
    </div>
  </div>

  <script>
    (function () {
      // ?debug=<comma-separated qualities> tweaks behaviour for testing:
      //   fast    — short per-side timers + get-ready hold
      //   fortune — skip brushing, jump straight to the "Reveal fortune" screen
      // A bare ?debug (no value) is treated as "fast" for backwards compat.
      var debugParam = new URLSearchParams(window.location.search).get("debug");
      var DEBUG = {};
      if (debugParam !== null) {
        (debugParam === "" ? "fast" : debugParam).split(",").forEach(function (q) {
          q = q.trim();
          if (q) DEBUG[q] = true;
        });
      }
      var DEBUG_FAST = !!DEBUG.fast;
      var DEBUG_FORTUNE = !!DEBUG.fortune;

      var SECONDS = DEBUG_FAST ? 4 : 30; // seconds per side (short when fast)
      var SIDE_COUNT = 4; // four mouth quadrants to brush
      // "Get ready" hold after tapping Start/Next before the countdown runs.
      var READY_MS = DEBUG_FAST ? 1000 : 2000;
      // End-sequence timings: how long the celebration holds before the
      // "Reveal fortune" button appears, and how long the fortune shows
      // before the "Do it again" button appears.
      var REVEAL_MS = 1600;
      var FORTUNE_MS = 2000;
      // Pause after "Your fortune is:" appears before the animal pops in.
      var FORTUNE_EMOJI_DELAY = 700;

      // Allow-list of fortune animals — one is picked at random on reveal.
      var ANIMAL_EMOJI = [
        "🐶", "🐱", "🐭", "🐹", "🐰", "🦊", "🐻", "🐼", "🐨", "🐯",
        "🦁", "🐮", "🐷", "🐸", "🐵", "🐔", "🐧", "🐦", "🦆", "🦉",
        "🐴", "🦄", "🐝", "🦋", "🐢", "🐙", "🐬", "🐳", "🦈", "🦖",
        "🦕", "🦒", "🦘", "🦔", "🦦", "🦥", "🦩", "🦭", "🐊", "🦓"
      ];

      var body = document.body;
      var emojiEl = document.getElementById("emoji");
      var headlineEl = document.getElementById("headline");
      var timerEl = document.getElementById("timer");
      var ringEl = document.getElementById("timerRing");
      var ringFillEl = document.getElementById("ringFill");
      var mouthEl = document.getElementById("mouth");
      var quads = Array.prototype.slice.call(
        mouthEl.querySelectorAll(".quad")
      );
      var btn = document.getElementById("btn");
      var btnFaceEl = document.getElementById("btnFace");
      var fortuneLabelEl = document.getElementById("fortuneLabel");
      var fortuneSlotEl = document.getElementById("fortuneSlot");
      var fortuneEmojiEl = document.getElementById("fortuneEmoji");

      // Brushing order is shuffled each session so the quadrants light up in
      // a random sequence; `step` tracks how many are done (0..SIDE_COUNT)
      // and order[step] is the quadrant currently active.
      var order = [0, 1, 2, 3];
      var step = 0;
      var remaining = SECONDS;
      var intervalId = null; // the per-second countdown
      var readyTimeoutId = null; // the "get ready" hold before a side starts
      var brushing = false; // true only while a side's timer is running
      var arming = false; // true during the "get ready" hold
      var endTimeoutId = null; // celebration → fortune → restart delays
      var pendingAction = null; // what the shared button does at the very end

      // Fisher–Yates shuffle (reorders the array in place and returns it).
      function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var t = arr[i];
          arr[i] = arr[j];
          arr[j] = t;
        }
        return arr;
      }

      function clearTimers() {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
        if (readyTimeoutId) {
          clearTimeout(readyTimeoutId);
          readyTimeoutId = null;
        }
        if (endTimeoutId) {
          clearTimeout(endTimeoutId);
          endTimeoutId = null;
        }
      }

      // ---- Circular progress ring ----
      var RING_C = 2 * Math.PI * 90; // circle r=90 in the SVG
      ringFillEl.style.strokeDasharray = RING_C;
      // fraction 0 = empty ring, 1 = full ring
      function setRing(fraction) {
        ringFillEl.style.strokeDashoffset = RING_C * (1 - fraction);
      }

      // ---- Sound: gentle Web Audio beep (no external files) ----
      var audioCtx = null;
      // Create the AudioContext lazily (browsers require a user gesture);
      // returns null if Web Audio isn't available.
      function ensureAudio() {
        if (!audioCtx) {
          try {
            var AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();
          } catch (e) {
            /* audio not available */
          }
        }
        return audioCtx;
      }
      function beep() {
        if (!ensureAudio()) return;
        try {
          var now = audioCtx.currentTime;
          [0, 0.18].forEach(function (offset) {
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.value = 660;
            gain.gain.setValueAtTime(0.0001, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.25, now + offset + 0.02);
            gain.gain.exponentialRampToValueAtTime(
              0.0001,
              now + offset + 0.16
            );
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.18);
          });
        } catch (e) {
          /* audio not available — silently ignore */
        }
      }

      function setBodySide(i) {
        body.className = "side-" + i;
      }

      function paintMouth() {
        var activeIdx = order[step]; // undefined once all sides are done
        quads.forEach(function (q) {
          var idx = parseInt(q.getAttribute("data-quad"), 10);
          var pos = order.indexOf(idx); // this corner's place in the order
          q.classList.remove("active", "done");
          if (pos < step) {
            // Completed — toothy (clean) smile
            q.classList.add("done");
            q.textContent = "😁";
          } else if (idx === activeIdx && (brushing || arming)) {
            // Current corner — toothbrush (shown during get-ready + brushing)
            q.classList.add("active");
            q.textContent = "🪥";
          } else {
            // Waiting (incl. the upcoming corner before you tap Next) —
            // closed-mouth smile
            q.textContent = "🙂";
          }
        });
      }

      function showIdle() {
        clearTimers();
        pendingAction = null;
        step = 0;
        order = shuffle([0, 1, 2, 3]); // fresh random order each session
        remaining = SECONDS;
        brushing = false;
        arming = false;
        setBodySide(order[0]);
        emojiEl.textContent = "🦷";
        emojiEl.classList.remove("celebrate-emoji", "hidden");
        headlineEl.classList.remove("hidden");
        headlineEl.textContent = "Toothbrush Timer";
        // Restore the mouth map and clear any fortune from a previous round.
        mouthEl.classList.remove("hidden");
        fortuneLabelEl.classList.add("hidden");
        fortuneSlotEl.classList.add("hidden");
        fortuneEmojiEl.classList.remove("reveal");
        ringEl.classList.add("hidden");
        paintMouth();
        btnFaceEl.textContent = "Start";
        btn.classList.remove("hidden");
      }

      function renderSide() {
        setBodySide(order[step]);
        // Keep it clean while brushing: no direction emoji, corner name,
        // or "Side X of 4" — the mouth map shows which corner is active.
        emojiEl.textContent = "";
        headlineEl.textContent = "";
        paintMouth();
      }

      // "Get ready" hold: highlight the (random) active corner and show the
      // full time on a still, empty ring for READY_MS before counting down.
      function armSide() {
        arming = true;
        brushing = false;
        renderSide(); // sets colour + toothbrush on the active corner
        headlineEl.textContent = "Get ready…";
        remaining = SECONDS;
        timerEl.textContent = SECONDS; // hold on 30
        ringEl.classList.remove("hidden");
        btn.classList.add("hidden");

        // Ring empty and frozen during the hold.
        ringFillEl.style.transition = "none";
        setRing(0);

        readyTimeoutId = setTimeout(function () {
          readyTimeoutId = null;
          startSide();
        }, READY_MS);
      }

      function startSide() {
        arming = false;
        brushing = true;
        headlineEl.textContent = "";
        paintMouth(); // keep the active corner lit as brushing begins
        remaining = SECONDS;
        timerEl.textContent = remaining;
        ringEl.classList.remove("hidden");
        btn.classList.add("hidden");

        // Snap the ring to empty, then let CSS fill it smoothly over the
        // whole side duration — matches the timer exactly at any length.
        ringFillEl.style.transition = "none";
        setRing(0);
        void ringFillEl.getBoundingClientRect(); // force reflow
        ringFillEl.style.transition =
          "stroke-dashoffset " + SECONDS + "s linear";
        setRing(1);

        intervalId = setInterval(function () {
          remaining -= 1;
          if (remaining > 0) {
            timerEl.textContent = remaining;
            return;
          }
          // Side finished
          clearInterval(intervalId);
          intervalId = null;
          timerEl.textContent = 0;
          beep();
          finishSide();
        }, 1000);
      }

      function finishSide() {
        // Mark this side done; no longer brushing until Next is tapped
        brushing = false;
        arming = false;
        step += 1;
        paintMouth();
        ringEl.classList.add("hidden");

        if (step >= SIDE_COUNT) {
          celebrate();
          return;
        }

        // Pause between sides — wait for a tap
        headlineEl.textContent = "Nice!";
        emojiEl.textContent = "👍";
        btnFaceEl.textContent = "Next";
        btn.classList.remove("hidden");
      }

      function celebrate() {
        body.className = "celebrate";
        // Keep the mouth visible — all four corners now show clean smiles.
        ringEl.classList.add("hidden");
        emojiEl.textContent = "🎉";
        emojiEl.classList.add("celebrate-emoji");
        headlineEl.textContent = "You did it!";
        // Hide the button; it comes back shortly as "Reveal fortune".
        btn.classList.add("hidden");
        launchConfetti();

        endTimeoutId = setTimeout(function () {
          endTimeoutId = null;
          btnFaceEl.textContent = "Reveal fortune";
          btn.classList.remove("hidden");
          pendingAction = revealFortune;
        }, REVEAL_MS);
      }

      function pickAnimal() {
        return ANIMAL_EMOJI[Math.floor(Math.random() * ANIMAL_EMOJI.length)];
      }

      function revealFortune() {
        // Swap the celebration (quadrants + 🎉 + "You did it!") for the
        // "Your fortune is:" label. The animal is held back briefly, then
        // tweened in.
        emojiEl.classList.remove("celebrate-emoji");
        emojiEl.classList.add("hidden");
        headlineEl.classList.add("hidden");
        mouthEl.classList.add("hidden");

        fortuneLabelEl.classList.remove("hidden");
        // Reveal the slot now (the emoji is opacity:0 until it pops in) so the
        // layout is settled before the animal appears.
        fortuneEmojiEl.classList.remove("reveal");
        fortuneEmojiEl.textContent = pickAnimal();
        fortuneSlotEl.classList.remove("hidden");

        // Button stays hidden through the whole reveal.
        btn.classList.add("hidden");

        // 1) After a beat, pop the animal in (fade + shrink to size)…
        endTimeoutId = setTimeout(function () {
          void fortuneEmojiEl.offsetWidth; // reflow so the animation retriggers
          fortuneEmojiEl.classList.add("reveal");

          // 2) …then, after a moment to enjoy it, offer "Do it again".
          endTimeoutId = setTimeout(function () {
            endTimeoutId = null;
            btnFaceEl.textContent = "Do it again";
            btn.classList.remove("hidden");
            pendingAction = showIdle;
          }, FORTUNE_MS);
        }, FORTUNE_EMOJI_DELAY);
      }

      function launchConfetti() {
        var pieces = ["🎉", "⭐", "✨", "🦷", "💙"];
        for (var i = 0; i < 24; i++) {
          var c = document.createElement("div");
          c.className = "confetti";
          c.textContent = pieces[i % pieces.length];
          c.style.left = ((i * 37) % 100) + "vw";
          c.style.animationDuration = 2 + ((i % 5) * 0.4) + "s";
          c.style.animationDelay = (i % 6) * 0.15 + "s";
          document.body.appendChild(c);
          (function (node) {
            setTimeout(function () {
              if (node.parentNode) node.parentNode.removeChild(node);
            }, 5000);
          })(c);
        }
      }

      btn.addEventListener("click", function () {
        // Unlock audio on this user gesture so the beep can play later.
        if (ensureAudio() && audioCtx.state === "suspended") audioCtx.resume();

        if (pendingAction) {
          // End sequence: the button is either "Reveal fortune" or
          // "Do it again" — run whichever action is queued.
          var run = pendingAction;
          pendingAction = null;
          run();
        } else {
          // "Start" or "Next" — get ready, then begin the current side.
          armSide();
        }
      });

      // Debug helper: skip brushing and drop straight into the celebration,
      // which then offers the "Reveal fortune" button.
      function startAtFortune() {
        order = shuffle([0, 1, 2, 3]);
        step = SIDE_COUNT; // treat every quadrant as already brushed
        brushing = false;
        arming = false;
        pendingAction = null;
        paintMouth(); // all four corners show clean smiles
        celebrate();
      }

      // Initial state
      if (DEBUG_FORTUNE) {
        startAtFortune();
      } else {
        showIdle();
      }
    })();
  </script>
